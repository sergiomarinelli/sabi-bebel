<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10070c"><title>Sabrina e Sérgio</title><style>html,body{margin:0;background:#090608;color:#fff;font-family:system-ui}body{display:grid;place-items:center;min-height:100vh}.load{text-align:center;padding:24px}.heart{font-size:42px;animation:p 1.3s infinite}@keyframes p{50%{transform:scale(1.16)}}</style></head><body><div class="load"><div class="heart">♡</div><p>Carregando nossa história...</p></div><script>fetch('final-preview.html?v=fotos-reais-2').then(r=>r.text()).then(html=>{const doc=new DOMParser().parseFromString(html,'text/html');doc.querySelectorAll('.photo,.chapter-photo,.gallery').forEach(el=>el.remove());const hero=doc.querySelector('.hero');if(hero){hero.style.background='none';hero.style.minHeight='82svh'}const makePhoto=(src)=>{const figure=doc.createElement('figure');figure.className='photo-real reveal';const img=doc.createElement('img');img.src=src;img.alt='Sabrina e Sérgio';figure.appendChild(img);return figure};const sections=[...doc.querySelectorAll('section')];if(hero)hero.insertAdjacentElement('afterend',makePhoto('assets/casal-01.webp?v=2'));if(sections[2])sections[2].insertAdjacentElement('afterend',makePhoto('assets/casal-02.webp?v=2'));const style=doc.createElement('style');style.textContent='.photo-real{margin:0;padding:0;width:100%;background:#090608}.photo-real img{display:block;width:100%;height:auto;object-fit:contain;background:#090608}@media(min-width:760px){.photo-real{width:min(760px,100%);margin:22px auto}.photo-real img{border-radius:24px}}';doc.head.appendChild(style);document.open();document.write('<!doctype html>'+doc.documentElement.outerHTML);document.close()}).catch(()=>{document.body.innerHTML='<div class="load"><p>Não consegui carregar. Atualize a página.</p></div>'})</script></body></html>
