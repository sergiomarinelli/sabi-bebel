<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10070c"><title>Sabrina e Sérgio</title><style>html,body{margin:0;background:#090608;color:#fff;font-family:system-ui}body{display:grid;place-items:center;min-height:100vh}.load{text-align:center;padding:24px}.heart{font-size:42px;animation:p 1.3s infinite}@keyframes p{50%{transform:scale(1.16)}}</style></head><body><div class="load"><div class="heart">♡</div><p>Carregando nossa história...</p></div><script>Promise.all([fetch('final-preview.html?v=final4').then(r=>r.text()),fetch('assets/foto.txt?v=final4').then(r=>r.text())]).then(([html,img])=>{const data='data:image/webp;base64,'+img.trim();const doc=new DOMParser().parseFromString(html,'text/html');const hero=doc.querySelector('.hero');if(hero){hero.style.background='none';hero.style.minHeight='78svh';const figure=doc.createElement('figure');figure.className='photo-only reveal';figure.style.cssText='margin:0;padding:0;background:#090608;width:100%';const image=doc.createElement('img');image.src=data;image.alt='Sabrina e Sérgio';image.style.cssText='display:block;width:100%;height:auto;object-fit:contain;background:#090608';figure.appendChild(image);hero.insertAdjacentElement('afterend',figure)}doc.querySelectorAll('.photo').forEach(el=>el.remove());const extraStyle=doc.createElement('style');extraStyle.textContent='@media(min-width:760px){.photo-only{width:min(760px,100%)!important;margin:0 auto!important;padding:18px 0!important}.photo-only img{border-radius:24px}}';doc.head.appendChild(extraStyle);document.open();document.write('<!doctype html>'+doc.documentElement.outerHTML);document.close()}).catch(()=>{document.body.innerHTML='<div class="load"><p>Não consegui carregar. Atualize a página.</p></div>'})</script></body></html>
