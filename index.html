<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10070c"><title>Sabrina e Sérgio</title><style>html,body{margin:0;background:#090608;color:#fff;font-family:system-ui}body{display:grid;place-items:center;min-height:100vh}.load{text-align:center;padding:24px}.heart{font-size:42px;animation:p 1.3s infinite}@keyframes p{50%{transform:scale(1.16)}}</style></head><body><div class="load"><div class="heart">♡</div><p>Carregando nossa história...</p></div><script>Promise.all([fetch('final-preview.html?v=final3').then(r=>r.text()),fetch('assets/foto.txt?v=final3').then(r=>r.text())]).then(([html,img])=>{const data='data:image/webp;base64,'+img.trim();html=html.replaceAll('assets/foto-1.webp',data).replaceAll('assets/foto-3.webp',data).replaceAll('assets/foto-8.webp',data).replaceAll('assets/foto-10.webp',data);document.open();document.write(html);document.close()}).catch(()=>{document.body.innerHTML='<div class="load"><p>Não consegui carregar. Atualize a página.</p></div>'})</script></body></html>
