<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10070c"><title>Sabrina e Sérgio</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}body{min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 18%,rgba(177,65,105,.28),transparent 34%),linear-gradient(180deg,#0b0709,#160a10 55%,#090608);color:#fff8f5}.card{width:min(620px,100%);text-align:center;padding:36px 22px;border:1px solid rgba(255,255,255,.13);border-radius:30px;background:rgba(255,255,255,.055);box-shadow:0 28px 80px rgba(0,0,0,.38);backdrop-filter:blur(12px)}.heart{font-size:40px;animation:pulse 1.5s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.15)}}h1{margin:14px 0 8px;font-family:Georgia,serif;font-size:clamp(42px,12vw,72px);line-height:.98}p{margin:0 0 30px;color:#d8c2ca;font-size:16px;line-height:1.6}.timer{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.box{padding:20px 8px;border:1px solid rgba(255,255,255,.12);border-radius:20px;background:rgba(255,255,255,.06)}.number{display:block;font-family:Georgia,serif;font-size:clamp(34px,9vw,58px);font-weight:700}.label{display:block;margin-top:5px;color:#cbb3bc;font-size:10px;letter-spacing:.12em;text-transform:uppercase}.date{margin-top:26px;color:#f3a9bd;font-size:13px}.done{font-family:Georgia,serif;font-size:36px;margin-top:20px}@media(max-width:560px){.timer{grid-template-columns:repeat(2,1fr)}.card{padding:30px 16px}}</style></head><body><main class="card"><div class="heart">♥</div><h1>Sabrina e Sérgio</h1><p>Contando cada segundo para te ver de novo.</p><section class="timer" id="timer"><div class="box"><span class="number" id="days">00</span><span class="label">dias</span></div><div class="box"><span class="number" id="hours">00</span><span class="label">horas</span></div><div class="box"><span class="number" id="minutes">00</span><span class="label">minutos</span></div><div class="box"><span class="number" id="seconds">00</span><span class="label">segundos</span></div></section><div class="done" id="done" hidden>Chegou a hora ♥</div><div class="date">Domingo, 2 de agosto, às 19h</div></main><script>const target=new Date('2026-08-02T19:00:00-03:00').getTime();const pad=n=>String(n).padStart(2,'0');function update(){const diff=target-Date.now();if(diff<=0){document.getElementById('timer').hidden=true;document.getElementById('done').hidden=false;return}document.getElementById('days').textContent=pad(Math.floor(diff/86400000));document.getElementById('hours').textContent=pad(Math.floor(diff%86400000/3600000));document.getElementById('minutes').textContent=pad(Math.floor(diff%3600000/60000));document.getElementById('seconds').textContent=pad(Math.floor(diff%60000/1000))}update();setInterval(update,1000);</script></body></html>
