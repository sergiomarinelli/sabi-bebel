<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10070c"><title>Sabrina e Sérgio</title><style>html,body{margin:0;background:#090608;color:#fff;font-family:system-ui}.load{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.heart{font-size:42px;animation:p 1.3s infinite}@keyframes p{50%{transform:scale(1.16)}}</style></head><body><div class="load"><div><div class="heart">♡</div><p>Carregando nossa história...</p></div></div><script>fetch('final-preview.html?v=sem-imagens-final').then(r=>{if(!r.ok)throw new Error('html');return r.text()}).then(html=>{const doc=new DOMParser().parseFromString(html,'text/html');doc.querySelectorAll('img,picture,figure,.photo,.chapter-photo,.gallery,.album-scroll,.photo-real').forEach(el=>el.remove());doc.querySelectorAll('[style*="background-image"],.hero').forEach(el=>{el.style.backgroundImage='none';if(el.classList.contains('hero')){el.style.background='none';el.style.minHeight='82svh'}});const style=doc.createElement('style');style.textContent='img,picture,figure,.photo,.chapter-photo,.gallery,.album-scroll,.photo-real{display:none!important;background-image:none!important}.hero{background:none!important}';doc.head.appendChild(style);document.open();document.write('<!doctype html>'+doc.documentElement.outerHTML);document.close()}).catch(()=>{document.body.innerHTML='<div class="load"><p>Não consegui carregar. Atualize a página.</p></div>'})</script></body></html>
