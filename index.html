<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10070c"><title>Sabrina e Sérgio</title><style>html,body{margin:0;background:#090608;color:#fff;font-family:system-ui}body{display:grid;place-items:center;min-height:100vh}.load{text-align:center;padding:24px}.heart{font-size:42px;animation:p 1.3s infinite}@keyframes p{50%{transform:scale(1.16)}}</style></head><body><div class="load"><div class="heart">♡</div><p>Carregando nossa história...</p></div><script>const v='album-final-1';Promise.all([fetch('final-preview.html?v='+v).then(r=>r.text()),...Array.from({length:6},(_,i)=>fetch('assets/album-0'+i+'.txt?v='+v).then(r=>r.text()))]).then(([html,...parts])=>{html=html.replaceAll('Talvez você nunca imagine o quanto essa segunda chance significa para mim.','Essa segunda chance significa muito para mim.').replaceAll('O amor venceu o orgulho.','Aos poucos aquilo foi ficando menos pesado e a gente começou a olhar mais para o que queria construir.').replaceAll('Eu voltei. E dessa vez eu quero fazer direito.','Obrigado por ter esperado a minha volta. Agora eu quero fazer essa oportunidade valer a pena.').replaceAll('Você ficou distante.','No começo eu senti que você ainda estava se protegendo.').replaceAll('O passado apareceu.','Na quarta a gente falou de assuntos do passado que ainda doíam.');const doc=new DOMParser().parseFromString(html,'text/html');doc.querySelectorAll('.photo').forEach(el=>el.remove());const hero=doc.querySelector('.hero');if(hero){hero.style.background='none';hero.style.minHeight='82svh'}const introP=doc.querySelector('.intro p');if(introP)introP.textContent='Tem algumas coisas que eu nunca te contei sobre o dia em que resolvi te procurar.';const heroP=doc.querySelector('.hero p');if(heroP)heroP.textContent='Eu pensei em você durante o dia inteiro e só perto da meia noite consegui mandar aquela mensagem.';const figure=doc.createElement('figure');figure.className='album-only reveal';const image=doc.createElement('img');image.src='data:image/webp;base64,'+parts.join('').replace(/\s/g,'');image.alt='Fotos de Sabrina e Sérgio';figure.appendChild(image);const letter=doc.querySelector('.letter');if(letter){letter.closest('section').insertAdjacentElement('beforebegin',figure)}else{doc.querySelector('main').appendChild(figure)}const extraStyle=doc.createElement('style');extraStyle.textContent='.album-only{margin:0;padding:0;background:#090608;width:100%}.album-only img{display:block;width:100%;height:auto;object-fit:contain;background:#090608}@media(min-width:760px){.album-only{width:min(760px,100%);margin:20px auto}.album-only img{border-radius:24px}}';doc.head.appendChild(extraStyle);document.open();document.write('<!doctype html>'+doc.documentElement.outerHTML);document.close()}).catch(()=>{document.body.innerHTML='<div class="load"><p>Não consegui carregar. Atualize a página.</p></div>'})</script></body></html>
