<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10070c"><title>Sabrina e Sérgio</title><style>html,body{margin:0;background:#090608;color:#fff;font-family:system-ui}body{display:grid;place-items:center;min-height:100vh}.load{text-align:center;padding:24px}.heart{font-size:42px;animation:p 1.3s infinite}@keyframes p{50%{transform:scale(1.16)}}</style></head><body><div class="load"><div class="heart">♡</div><p>Carregando nossa história...</p></div><script>const version='scroll-fotos-1';Promise.all([fetch('final-preview.html?v='+version).then(r=>r.text()),fetch('assets/album-scroll-base64.txt?v='+version).then(r=>r.text())]).then(([html,album])=>{const doc=new DOMParser().parseFromString(html,'text/html');doc.querySelectorAll('.photo,.chapter-photo,.gallery').forEach(el=>el.remove());const hero=doc.querySelector('.hero');if(hero){hero.style.background='none';hero.style.minHeight='82svh'}const albumFigure=doc.createElement('figure');albumFigure.className='album-scroll reveal';const albumImage=doc.createElement('img');albumImage.src='data:image/webp;base64,'+album.trim();albumImage.alt='Fotos de Sabrina e Sérgio';albumImage.loading='eager';albumFigure.appendChild(albumImage);const sections=[...doc.querySelectorAll('section')];if(sections[2]){sections[2].insertAdjacentElement('afterend',albumFigure)}else if(hero){hero.insertAdjacentElement('afterend',albumFigure)}const style=doc.createElement('style');style.textContent='.album-scroll{margin:0;padding:0;width:100%;background:#090608}.album-scroll img{display:block;width:100%;height:auto;object-fit:contain;background:#090608}@media(min-width:760px){.album-scroll{width:min(760px,100%);margin:22px auto}.album-scroll img{border-radius:24px}}';doc.head.appendChild(style);document.open();document.write('<!doctype html>'+doc.documentElement.outerHTML);document.close()}).catch(()=>{document.body.innerHTML='<div class="load"><p>Não consegui carregar. Atualize a página.</p></div>'})</script></body></html>
