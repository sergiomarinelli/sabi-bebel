name: Decode album image
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/decode-album.yml'
      - 'assets/album-scroll-base64.txt'
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode WebP
        run: |
          base64 --decode assets/album-scroll-base64.txt > assets/album-scroll.webp
          file assets/album-scroll.webp
      - name: Commit binary image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/album-scroll.webp
          git commit -m "Gera álbum WebP binário real" || exit 0
          git push
